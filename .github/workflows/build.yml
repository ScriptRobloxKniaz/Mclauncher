name: Build APK

# Собирает debug-APK при каждом коммите, при pull request и по кнопке «Run workflow».
#
# Исходники могут лежать двумя способами:
#   1) прямо в корне репозитория (есть settings.gradle.kts) — собирается он;
#   2) внутри zip-архива проекта — берётся архив с наибольшим номером в имени, распаковывается и собирается.
# Исправления в коде делаются в коде, а не командами sed внутри workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            # Если архивов несколько, берём последний по версионной сортировке имён (4.7 новее 4.6).
            zip_file="$(find . -maxdepth 2 -name '*.zip' -not -path './_src/*' | sort -V | tail -n 1)"
            if [ -z "$zip_file" ]; then echo "No settings.gradle.kts and no zip found"; exit 1; fi
            echo "Unpacking: $zip_file"
            mkdir -p _src
            unzip -q -o "$zip_file" -d _src
            settings="$(find _src -name settings.gradle.kts | head -n 1)"
            if [ -z "$settings" ]; then echo "settings.gradle.kts not found inside zip"; exit 1; fi
            echo "PROJECT_DIR=$(dirname "$settings")" >> "$GITHUB_ENV"
          fi
          cat "$GITHUB_ENV"

      - name: Show SDK levels
        working-directory: ${{ env.PROJECT_DIR }}
        run: grep -n "compileSdk\|targetSdk\|minSdk" app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.6.0

      - name: Make gradlew executable (if present)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; echo "gradlew: +x"; else echo "gradlew not found, using setup-gradle"; fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: mclauncher-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fetch real Mojang fixtures (optional)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: python3 -I scripts/fetch_fixtures.py

      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
